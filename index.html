<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brawl Stars - Recovery Center</title>
    <style>
        :root {
            --bs-blue: #007bff;
            --bs-yellow: #ffcc00;
            --bs-dark: #1a1a1a;
            --terminal-green: #00ff7a;
            --error-red: #ff3333;
            --ultra-gold: #ffd54a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #252525, var(--bs-dark));
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background 0.5s ease;
            overflow: hidden;
        }

        .container {
            background: linear-gradient(145deg, #2c3e50, #000000);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: min(92vw, 520px);
            text-align: center;
            border: 3px solid var(--bs-yellow);
            position: relative;
        }

        .step { display: none; }
        .active { display: block; animation: fadeIn 0.45s ease; }

        h1, h2, h3, p { margin-top: 0; }

        input {
            width: 88%;
            padding: 12px 14px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            outline: none;
            background: #efefef;
            color: #222;
        }

        button {
            background-color: var(--bs-yellow);
            color: black;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        button:hover { transform: translateY(-1px); filter: brightness(1.05); }
        button:active { transform: translateY(0); }

        .progress-box {
            background: #333;
            height: 30px;
            width: 100%;
            margin: 15px 0;
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            display: none;
            border: 1px solid rgba(255,255,255,0.15);
        }

        #bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b4ff, #00ff9d);
            transition: width 0.15s linear;
        }

        #percent {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            mix-blend-mode: difference;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        .terminal-screen {
            height: 230px;
            overflow-y: auto;
            text-align: left;
            background: #050505;
            padding: 12px;
            border: 1px solid #444;
            font-size: 14px;
            margin: 12px 0 10px;
            font-family: Consolas, "Courier New", monospace;
            border-radius: 12px;
            box-shadow: inset 0 0 14px rgba(0,0,0,0.6);
        }

        .terminal-line {
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .prompt-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .prompt {
            color: #59ff84;
            font-family: Consolas, "Courier New", monospace;
            font-weight: bold;
            white-space: nowrap;
        }

        #terminal-input {
            width: 100%;
            background: #000;
            color: #00ff7a;
            border: 1px solid #00ff7a;
            margin: 0;
            font-family: Consolas, "Courier New", monospace;
        }

        .help-link {
            color: #aaa;
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
            margin-top: 15px;
            display: inline-block;
        }

        .help-link:hover { color: white; }

        .ultra-title {
            font-size: clamp(34px, 6vw, 56px);
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--ultra-gold);
            text-shadow:
                0 0 10px rgba(255, 213, 74, 0.9),
                0 0 24px rgba(255, 213, 74, 0.75),
                0 0 45px rgba(255, 120, 0, 0.35);
            animation: ultraPulse 1.2s infinite alternate;
            margin-bottom: 6px;
        }

        .ultra-subtitle {
            color: #d7d7d7;
            margin-bottom: 10px;
        }

        .glitch {
            position: relative;
            display: inline-block;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            overflow: hidden;
            opacity: 0.7;
        }

        .glitch::before {
            transform: translate(2px, -1px);
            color: #00d5ff;
            animation: glitch 1.8s infinite linear alternate-reverse;
        }

        .glitch::after {
            transform: translate(-2px, 1px);
            color: #ff3d7f;
            animation: glitch 1.4s infinite linear alternate-reverse;
        }

        .saved-message {
            font-size: 24px;
            font-weight: 800;
            color: var(--terminal-green);
            text-shadow: 0 0 12px rgba(0,255,122,0.7);
        }

        .status-msg {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
            min-height: 16px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes ultraPulse { from { transform: scale(1); filter: brightness(1); } to { transform: scale(1.02); filter: brightness(1.18); } }
        @keyframes glitch {
            0% { clip-path: inset(0 0 92% 0); }
            20% { clip-path: inset(18% 0 45% 0); }
            40% { clip-path: inset(55% 0 22% 0); }
            60% { clip-path: inset(8% 0 74% 0); }
            80% { clip-path: inset(38% 0 36% 0); }
            100% { clip-path: inset(0 0 0 0); }
        }

        .blink {
            animation: blink 1s steps(1, end) infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body id="bg">
    <div class="container" id="box">
        <div id="step1" class="step active">
            <h1 style="color: var(--bs-yellow);">Brawl Stars Hesap Kurtar</h1>
            <input type="text" id="username" placeholder="Kullanıcı ismini girin..." />
            <button onclick="startApp()">İleri</button>
        </div>

        <div id="step2" class="step">
            <h3>UUID Kodunu Girin</h3>
            <input type="text" id="uuid-input" placeholder="Kod..." />
            <button onclick="checkUUID()">Onayla</button>
        </div>

        <div id="ultra-step" class="step">
            <div class="ultra-title glitch" data-text="ULTRA">ULTRA</div>
            <div class="ultra-subtitle">Terminal bağlantısı kuruluyor...</div>

            <div id="ultra-log" class="terminal-screen"></div>

            <div class="prompt-row">
                <span class="prompt">&gt;</span>
                <input type="text" id="terminal-input" placeholder="Komudu yazın..." />
            </div>

            <div id="loader" class="progress-box">
                <div id="bar"></div>
                <div id="percent">%0</div>
            </div>
            <div id="status-msg" class="status-msg"></div>
        </div>

        <div id="final-step" class="step">
            <div class="saved-message">HESAP KURTARILDI</div>
            <p>İşlem başarıyla tamamlandı.</p>
            <button onclick="location.reload()">Başa Dön</button>
        </div>
    </div>

    <script>
        const step1 = document.getElementById("step1");
        const step2 = document.getElementById("step2");
        const ultraStep = document.getElementById("ultra-step");
        const finalStep = document.getElementById("final-step");
        const log = document.getElementById("ultra-log");
        const terminalInput = document.getElementById("terminal-input");
        const loader = document.getElementById("loader");
        const bar = document.getElementById("bar");
        const pct = document.getElementById("percent");
        const msg = document.getElementById("status-msg");

        let saveRunning = false;
        let saveInterval = null;
        let saveTimeout = null;

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function addLine(text, color = "#d7d7d7") {
            const div = document.createElement("div");
            div.className = "terminal-line";
            div.style.color = color;
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        async function typeLine(text, color = "#d7d7d7", speed = 18) {
            const div = document.createElement("div");
            div.className = "terminal-line";
            div.style.color = color;
            log.appendChild(div);

            for (let i = 0; i <= text.length; i++) {
                div.textContent = text.slice(0, i) + (i < text.length ? "▌" : "");
                log.scrollTop = log.scrollHeight;
                await sleep(speed);
            }
        }

        function showProgressBar() {
            loader.style.display = "block";
            bar.style.width = "0%";
            pct.textContent = "%0";
            msg.textContent = "";
        }

        function resetProgress() {
            loader.style.display = "none";
            bar.style.width = "0%";
            pct.textContent = "%0";
            msg.textContent = "";
        }

        function startApp() {
            if (document.getElementById("username").value.trim() === "") return;
            step1.classList.remove("active");
            step2.classList.add("active");
        }

        async function checkUUID() {
            const val = document.getElementById("uuid-input").value.trim();
            if (val !== "92375") {
                alert("Sistem hatası veya geçersiz kod!");
                return;
            }

            step2.classList.remove("active");
            document.getElementById("bg").style.background = "radial-gradient(circle at top, #2b1600, #000)";
            document.getElementById("box").style.borderColor = "#ffb347";

            ultraStep.classList.add("active");
            log.innerHTML = "";
            addLine("> UUID doğrulandı: 92375", "#00ff7a");
            await sleep(450);
            await typeLine("> ULTRA terminal başlatılıyor...", "#ffd54a", 20);
            await typeLine("> Güvenli mod açıldı.", "#8be9fd", 20);
            await typeLine("> Komutlar yükleniyor...", "#cccccc", 20);
            terminalInput.focus();
        }

        async function runHelp() {
            addLine("> /Yardım komutu algılandı.", "#59ff84");
            await sleep(250);
            await typeLine("Yardım Menüsü:", "#ffd54a", 18);
            await typeLine("- UJ7dfısfwıe73wı", "#d7d7d7", 16);
            await typeLine("- U6dsusydıf4", "#d7d7d7", 16);
            await typeLine("- sad387G8jf", "#d7d7d7", 16);
        }

        async function runBrawl() {
            addLine("> /Brawl komutu algılandı.", "#59ff84");
            await sleep(250);
            await typeLine("Brawl çekirdeği aktif.", "#ffd54a", 18);
            await typeLine("Komutlar:", "#8be9fd", 18);
            await typeLine("- match.scan", "#d7d7d7", 16);
            await typeLine("- sync.player", "#d7d7d7", 16);
            await typeLine("- unlock.ultra", "#d7d7d7", 16);
            await typeLine("- save.core", "#d7d7d7", 16);
        }

        function startSave() {
            if (saveRunning) return;
            saveRunning = true;

            addLine("> /Save komutu algılandı.", "#59ff84");
            addLine("> Yeni kayıt alanına geçiliyor...", "#ffd54a");
            showProgressBar();

            const totalMs = 30000;
            const start = Date.now();

            saveInterval = setInterval(() => {
                const elapsed = Date.now() - start;
                const progress = Math.min(100, Math.floor((elapsed / totalMs) * 100));
                bar.style.width = progress + "%";
                pct.textContent = "%" + progress;
                msg.textContent = "Kurtarma işlemi sürüyor...";

                if (progress >= 100) {
                    clearInterval(saveInterval);
                    saveInterval = null;
                }
            }, 120);

            saveTimeout = setTimeout(() => {
                if (saveInterval) clearInterval(saveInterval);
                bar.style.width = "100%";
                pct.textContent = "%100";
                msg.textContent = "Hesap kurtarıldı.";
                setTimeout(() => {
                    ultraStep.classList.remove("active");
                    finalStep.classList.add("active");
                }, 700);
            }, totalMs);
        }

        async function handleCommand(raw) {
            const cmd = raw.trim();
            if (!cmd) return;

            addLine("> " + cmd, "#8be9fd");

            const normalized = cmd.toLowerCase();
            if (normalized === "/yardım" || normalized === "/yardim") {
                await runHelp();
            } else if (normalized === "/brawl") {
                await runBrawl();
            } else if (normalized === "/save") {
                startSave();
            } else {
                addLine("> Bilinmeyen komut. /Yardım yazın.", "#ffb347");
            }
        }

        terminalInput.addEventListener("keydown", async function (e) {
            if (e.key !== "Enter") return;
            if (saveRunning) {
                terminalInput.value = "";
                return;
            }

            const value = terminalInput.value;
            terminalInput.value = "";
            await handleCommand(value);
        });
    </script>
</body>
</html>
