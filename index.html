<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars - Hesap Kurtarma Sistemi</title>
    <style>
        :root {
            --bs-blue: #007bff;
            --bs-yellow: #ffcc00;
            --bs-dark: #1a1a1a;
            --terminal-green: #00FF00;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bs-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 1s;
        }

        .container {
            background: linear-gradient(145deg, #2c3e50, #000000);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 420px;
            text-align: center;
            border: 3px solid var(--bs-yellow);
        }

        /* Hack Modu Stil Değişimi */
        .hack-mode {
            background: black !important;
            border-color: var(--terminal-green) !important;
            font-family: 'Courier New', monospace;
        }

        .step { display: none; }
        .active { display: block; animation: fadeIn 0.5s; }

        input {
            width: 85%; padding: 12px; margin: 10px 0;
            border-radius: 8px; border: none; font-size: 16px; outline: none;
        }

        button {
            background-color: var(--bs-yellow); color: black;
            border: none; padding: 12px 25px; font-weight: bold;
            border-radius: 10px; cursor: pointer; margin-top: 10px;
        }

        /* Yükleme Çubuğu */
        .progress-box {
            background: #333; height: 25px; width: 100%;
            margin: 15px 0; position: relative; border-radius: 5px;
            overflow: hidden; display: none;
        }
        #bar { height: 100%; width: 0%; background: var(--bs-blue); transition: width 0.3s; }
        #percent { position: absolute; width: 100%; text-align: center; top: 3px; font-weight: bold; }

        /* Terminal */
        #terminal {
            height: 150px; overflow-y: auto; text-align: left;
            background: #050505; padding: 10px; border: 1px solid #333;
            font-size: 13px; margin-bottom: 10px; color: var(--terminal-green);
        }

        /* Seçenekler */
        .pro-option {
            background: #222; padding: 10px; margin: 5px;
            border: 1px solid #444; cursor: pointer;
        }
        .pro-option:hover { border-color: var(--terminal-green); }

        /* Puzzle */
        .puzzle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .piece { height: 60px; background: #333; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body id="bg">

<div class="container" id="box">
    <div id="step1" class="step active">
        <h1 id="title" style="color: var(--bs-yellow);">Brawl Stars Hesap Kurtar</h1>
        <input type="text" id="username" placeholder="Kullanıcı ismini girin..." />
        <button onclick="toUUID()">İleri</button>
    </div>

    <div id="step2" class="step">
        <h3 id="uuid-title">UUID Kodunu Girin</h3>
        <input type="text" id="uuid-input" placeholder="Kod..." />
        <button onclick="checkUUID()">Onayla</button>
    </div>

    <div id="hack-name" class="step">
        <h2 style="color: var(--terminal-green);">HACK PANEL V1.0</h2>
        <p>Hedef Kullanıcı İsmini Gir:</p>
        <input type="text" id="hack-user" style="background:#000; color:lime; border:1px solid lime;">
        <button onclick="startHackStep1()" style="background:lime;">SİSTEME SIZ</button>
    </div>

    <div id="hack-terminal-step" class="step">
        <div id="terminal"></div>
        <input type="text" id="cmd" placeholder="Komut yazın..." style="background:#000; color:lime; border:1px solid lime;">
    </div>

    <div id="hack-protection" class="step">
        <h3>Koruma Türü Seç:</h3>
        <div class="pro-option">GloGuard Pro</div>
        <div class="pro-option">Telefon koruyucusu Pro</div>
        <div class="pro-option">Unity Pro</div>
        <div class="pro-option" onclick="selectUnreal()" style="color: #00FF00; font-weight: bold;">Unreal Engine</div>
    </div>

    <div id="hack-puzzle" class="step">
        <p>Robot Doğrulaması: Yeşil olanı seç!</p>
        <div class="puzzle-grid">
            <div class="piece" onclick="alert('Yanlış!')">🔴</div>
            <div class="piece" onclick="finishHack()">🟢</div>
            <div class="piece" onclick="alert('Yanlış!')">🔵</div>
        </div>
    </div>

    <div id="hack-final" class="step">
        <h1 style="color: lime;">BAŞARILI</h1>
        <h3>Hesabınız Kurtarıldı!</h3>
        <button onclick="location.reload()">Kapat</button>
    </div>

    <div id="loader" class="progress-box">
        <div id="bar"></div>
        <div id="percent">%0</div>
    </div>
    <div id="status-msg" style="margin-top: 5px; font-size: 12px; color: #aaa;"></div>
</div>

<script>
    function showProgress(seconds, pauseAt99, callback) {
        const loader = document.getElementById('loader');
        const bar = document.getElementById('bar');
        const pct = document.getElementById('percent');
        loader.style.display = 'block';
        
        let width = 0;
        let intervalTime = (seconds * 1000) / 100;
        
        let timer = setInterval(() => {
            if (width < 99) {
                width++;
                bar.style.width = width + "%";
                pct.innerText = "%" + width;
            } else {
                clearInterval(timer);
                if (pauseAt99) {
                    document.getElementById('status-msg').innerText = "Sistem stabilize ediliyor";
                    setTimeout(() => {
                        width = 100;
                        bar.style.width = "100%";
                        pct.innerText = "%100";
                        setTimeout(() => {
                            loader.style.display = 'none';
                            document.getElementById('status-msg').innerText = "";
                            callback();
                        }, 500);
                    }, 35000); // 35 Saniye Bekleme
                } else {
                    width = 100;
                    bar.style.width = "100%";
                    pct.innerText = "%100";
                    setTimeout(() => {
                        loader.style.display = 'none';
                        callback();
                    }, 500);
                }
            }
        }, intervalTime);
    }

    function toUUID() {
        if(document.getElementById('username').value === "") return alert("İsim gir!");
        document.getElementById('step1').classList.remove('active');
        showProgress(15, false, () => {
            document.getElementById('step2').classList.add('active');
        });
    }

    function checkUUID() {
        const val = document.getElementById('uuid-input').value;
        if (val === "555482") {
            // HACK MODUNA GEÇİŞ
            document.getElementById('bg').style.background = "#001a00";
            document.getElementById('box').classList.add('hack-mode');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('hack-name').classList.add('active');
            document.getElementById('bar').style.backgroundColor = "lime";
        } else {
            alert("Hatalı Kod!");
        }
    }

    function startHackStep1() {
        if(document.getElementById('hack-user').value === "") return;
        document.getElementById('hack-name').classList.remove('active');
        showProgress(5, false, () => {
            document.getElementById('hack-terminal-step').classList.add('active');
            addLog("Terminal Hazır. Komut Bekleniyor...");
        });
    }

    function addLog(msg, color="lime") {
        const t = document.getElementById('terminal');
        t.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
        t.scrollTop = t.scrollHeight;
    }

    // KOMUT DİNLEYİCİ (/ACCOUNT-91)
    document.getElementById('cmd').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const cmdVal = this.value.toUpperCase();
            if (cmdVal === "/ACCOUNT-91") {
                this.style.display = "none";
                addLog("İşlem Başlatıldı...");
                
                // Logları zamanlı ekle
                setTimeout(() => addLog("Hesap aranıyor..."), 2000);
                setTimeout(() => addLog("Hesap bulundu: Yunus", "yellow"), 7000);
                setTimeout(() => addLog("Hesap kurtarılıyor..."), 12000);
                setTimeout(() => addLog("Hesap ta 2 kişi bulundu, Temizleniyor...", "cyan"), 15000);

                showProgress(60, true, () => {
                    document.getElementById('hack-terminal-step').classList.remove('active');
                    document.getElementById('hack-protection').classList.add('active');
                });
            } else {
                addLog("Bilinmeyen Komut: " + this.value, "red");
                this.value = "";
            }
        }
    });

    function selectUnreal() {
        document.getElementById('hack-protection').classList.remove('active');
        showProgress(2, false, () => {
            document.getElementById('hack-puzzle').classList.add('active');
        });
    }

    function finishHack() {
        document.getElementById('hack-puzzle').classList.remove('active');
        document.getElementById('hack-final').classList.add('active');
    }
</script>

</body>
</html>
