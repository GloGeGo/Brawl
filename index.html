<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Kurtarma & Hack Panel</title>
    <style>
        :root {
            --bs-blue: #007bff;
            --bs-yellow: #ffcc00;
            --bs-dark: #1a1a1a;
            --terminal-green: #00FF00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bs-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background 0.5s;
        }

        .container {
            background: linear-gradient(145deg, #2c3e50, #000000);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
            border: 3px solid var(--bs-yellow);
            z-index: 10;
        }

        /* Terminal Stili (Hack Panel) */
        .hack-mode {
            background-color: black !important;
            border-color: var(--terminal-green) !important;
            color: var(--terminal-green) !important;
            font-family: 'Courier New', Courier, monospace;
        }

        h1, h2, h3 { margin-bottom: 20px; }
        input {
            width: 80%; padding: 10px; margin: 10px 0;
            border-radius: 5px; border: none; font-size: 16px;
        }

        button {
            background-color: var(--bs-yellow); color: black;
            border: none; padding: 12px 25px; font-weight: bold;
            border-radius: 10px; cursor: pointer; margin-top: 10px;
        }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Yükleme Çubukları */
        .progress-container {
            background-color: #333; border-radius: 10px;
            margin: 20px 0; height: 15px; width: 100%;
            overflow: hidden; display: none;
        }
        .progress-bar {
            background: var(--bs-blue); height: 100%; width: 0%;
            transition: width linear;
        }
        .hack-bar { background: var(--terminal-green) !important; }

        /* Terminal Area */
        #terminal-log {
            text-align: left; height: 150px; overflow-y: auto;
            background: #050505; padding: 10px; border: 1px solid #333;
            font-size: 13px; margin-bottom: 10px;
        }

        .option-item {
            background: #333; padding: 10px; margin: 5px 0;
            border-radius: 8px; cursor: pointer; border: 2px solid transparent;
        }
        .selected { border-color: var(--bs-yellow); }

    </style>
</head>
<body id="main-body">

<div class="container" id="box">
    <div id="step1" class="step active">
        <h1>Brawl Stars Hesap Kurtar</h1>
        <input type="text" id="username" placeholder="Kullanıcı adını girin..." />
        <button onclick="startStep1()">Kurtarmaya Başla</button>
    </div>

    <div id="step2" class="step">
        <h3>UUID Kodunu Girin</h3>
        <input type="text" id="uuid-input" placeholder="Kod..." />
        <button onclick="handleUUID()">Onayla</button>
    </div>

    <div id="hack-step1" class="step">
        <h2 style="color: var(--terminal-green);">SYSTEM BREACH DETECTED</h2>
        <p>Hedef İsmini Gir:</p>
        <input type="text" id="hack-target" style="background:#111; color:lime; border:1px solid lime;">
        <button onclick="startHackProgress()" style="background:lime;">Sızmayı Başlat</button>
    </div>

    <div id="hack-terminal" class="step">
        <div id="terminal-log"></div>
        <input type="text" id="cmd-input" placeholder="Komut yazın..." style="background:black; color:lime; border:1px solid lime;">
        <p style="font-size:11px;">Bu panel sadece üst düzey koruma için!</p>
    </div>

    <div id="hack-final" class="step">
        <h2 id="hack-status">DOĞRULAMA BEKLENİYOR...</h2>
        <div id="robot-area" style="display:none;">
            <p>Robot Olmadığını Kanıtla:</p>
            <button onclick="finishHack()" style="background:red; color:white;">BEN ROBOT DEĞİLİM</button>
        </div>
        <h1 id="final-success" style="display:none; color:lime;">HESAP KURTARILDI!</h1>
    </div>

    <div id="step3" class="step">
        <h3>Hesabınızı Korumak İçin:</h3>
        <div class="option-item" onclick="selectOpt(this)">GloGuard</div>
        <div class="option-item" onclick="selectOpt(this)">VanGuard</div>
        <div class="option-item" onclick="selectOpt(this)">Telefon koruyucusu</div>
        <button onclick="normalFinal()">Onayla</button>
    </div>

    <div id="loader" class="progress-container">
        <div id="bar" class="progress-bar"></div>
    </div>
    <div id="percent-text"></div>
</div>

<script>
    function showLoader(seconds, isHack, callback) {
        const loader = document.getElementById('loader');
        const bar = document.getElementById('bar');
        const txt = document.getElementById('percent-text');
        
        loader.style.display = 'block';
        bar.style.width = '0%';
        if(isHack) bar.classList.add('hack-bar'); else bar.classList.remove('hack-bar');
        
        setTimeout(() => { bar.style.transition = `width ${seconds}s linear`; bar.style.width = '100%'; }, 50);

        let count = 0;
        let interval = setInterval(() => {
            count++;
            let p = Math.floor((count / (seconds * 10)) * 100);
            txt.innerText = "%" + (p > 100 ? 100 : p);
            if(count >= seconds * 10) {
                clearInterval(interval);
                loader.style.display = 'none';
                txt.innerText = "";
                callback();
            }
        }, 100);
    }

    function startStep1() {
        if(document.getElementById('username').value.length < 2) return alert("İsim gir!");
        document.getElementById('step1').classList.remove('active');
        showLoader(15, false, () => {
            document.getElementById('step2').classList.add('active');
        });
    }

    function handleUUID() {
        const val = document.getElementById('uuid-input').value;
        document.getElementById('step2').classList.remove('active');

        if(val === "555482") {
            // HACK PANELİ AÇILIYOR
            document.getElementById('box').classList.add('hack-mode');
            document.getElementById('main-body').style.background = "#001a00";
            document.getElementById('hack-step1').classList.add('active');
        } else if(val === "877254") {
            // NORMAL DEVAM
            showLoader(10, false, () => {
                document.getElementById('step3').classList.add('active');
            });
        } else {
            alert("Hatalı Kod!");
            document.getElementById('step2').classList.add('active');
        }
    }

    // HACK PANEL FONKSİYONLARI
    function startHackProgress() {
        document.getElementById('hack-step1').classList.remove('active');
        showLoader(5, true, () => {
            document.getElementById('hack-terminal').classList.add('active');
            addLog("Sistem bağlantısı kuruldu...");
            addLog("Terminal hazır. Komut bekliyor...");
        });
    }

    function addLog(msg) {
        const log = document.getElementById('terminal-log');
        log.innerHTML += `<div>> ${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    document.getElementById('cmd-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            if(this.value.toUpperCase() === "/DOCYPTE") {
                this.disabled = true;
                addLog("Çözümleme başlatılıyor: /DOCYPTE...");
                showLoader(40, true, () => {
                    document.getElementById('hack-terminal').classList.remove('active');
                    document.getElementById('hack-final').classList.add('active');
                    setTimeout(() => {
                        document.getElementById('robot-area').style.display = 'block';
                    }, 1000);
                });
            } else {
                addLog("Hatalı komut: " + this.value);
                this.value = "";
            }
        }
    });

    function finishHack() {
        document.getElementById('robot-area').style.display = 'none';
        document.getElementById('hack-status').innerText = "DOĞRULAMA BAŞARILI!";
        setTimeout(() => {
            document.getElementById('final-success').style.display = 'block';
        }, 1000);
    }

    // Normal Akış Finali
    function selectOpt(el) {
        document.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
    }
    function normalFinal() {
        alert("Başarılı! Hesabınız kurtarıldı.");
        location.reload();
    }
</script>

</body>
</html>
